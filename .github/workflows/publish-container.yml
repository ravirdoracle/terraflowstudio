name: Publish container image

'on':
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: publish-container-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    env:
      IMAGE_NAME: ghcr.io/ravirdoracle/terraflowstudio
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build native image for authentication check
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          push: false
          platforms: linux/${{ matrix.arch }}
          tags: localhost/terraflow-smoke:latest
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,scope=${{ matrix.arch }},mode=max
      - name: Check authenticated and unauthenticated requests
        run: |
          docker run --rm \
            -e APP_AUTH_USER=ci-user \
            -e APP_AUTH_PASSWORD=ci-test-password \
            localhost/terraflow-smoke:latest python -c '
          import base64
          from app import app
          client = app.test_client()
          assert client.get("/").status_code == 401
          assert client.get("/api/config").status_code == 401
          auth = base64.b64encode(b"ci-user:ci-test-password").decode()
          assert client.get("/", headers={"Authorization": "Basic " + auth}).status_code == 200
          print("Authentication checks passed")
          '
      - name: Sign in to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish architecture image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          platforms: linux/${{ matrix.arch }}
          tags: |
            ${{ env.IMAGE_NAME }}:sha-${{ github.sha }}-${{ matrix.arch }}
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,scope=${{ matrix.arch }},mode=max

  publish:
    name: Publish multi-architecture image
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    env:
      IMAGE_NAME: ghcr.io/ravirdoracle/terraflowstudio
    steps:
      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Sign in to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Combine architecture images
        run: |
          docker buildx imagetools create \
            --tag "$IMAGE_NAME:latest" \
            --tag "$IMAGE_NAME:sha-$GITHUB_SHA" \
            "$IMAGE_NAME:sha-$GITHUB_SHA-amd64" \
            "$IMAGE_NAME:sha-$GITHUB_SHA-arm64"
      - name: Verify both platforms
        run: |
          docker buildx imagetools inspect "$IMAGE_NAME:latest" --raw | python3 -c '
          import json, sys
          index = json.load(sys.stdin)
          platforms = {m.get("platform", {}).get("os", "") + "/" + m.get("platform", {}).get("architecture", "") for m in index["manifests"]}
          assert {"linux/amd64", "linux/arm64"} <= platforms, platforms
          print("Verified linux/amd64 and linux/arm64")
          '
